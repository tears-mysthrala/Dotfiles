name: Shell CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: Run syntax checks
        run: bash tests/smoke.bash syntax

      - name: Run ShellCheck
        run: make lint

  doctor:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run doctor checks
        run: bash tests/smoke.bash doctor

  profiles:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run profile smoke tests
        run: bash tests/smoke.bash profiles
